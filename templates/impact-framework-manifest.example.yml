name: open-susty-scans-impact-framework
description: Example manifest for reproducible webpage carbon estimation in open-susty-scans.
tags:
  kind: webpage
  complexity: low
  category: sustainability-scan
initialize:
  outputs:
    - yaml
  plugins:
    green-hosting:
      method: GreenHosting
      path: '@tngtech/if-webpage-plugins'
    webpage-impact:
      method: WebpageImpact
      path: '@tngtech/if-webpage-plugins'
      config:
        url: https://example.gov/
        scrollToBottom: false
    co2js:
      method: Co2js
      path: '@tngtech/if-webpage-plugins'
      config:
        type: swd
        version: 4
tree:
  children:
    webpage:
      pipeline:
        observe:
          - webpage-impact
          - green-hosting
        compute:
          - co2js
      inputs:
        - timestamp: '2026-04-22T00:00:00.000Z'
          duration: 1
          options:
            firstVisitPercentage: 0.9
            returnVisitPercentage: 0.1
